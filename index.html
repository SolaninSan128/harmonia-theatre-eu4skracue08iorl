function pathOf(n){const a=[];while(n){a.unshift(n.name);n=parent.get(n)}return a.join(" / ")}
function stats(){const a=TREE.A;$("stats").innerHTML=`<span class="stat">文件夹 <b>${a.fo}</b></span><span class="stat">视频 <b>${a.v}</b></span><span class="stat">总大小 <b>${fmt(a.s)}</b></span>`+(a.o?`<span class="stat">其他文件 <b>${a.o}</b></span>`:"")}
function crumb(){const a=[];let n=cur;while(n){a.unshift(n);n=parent.get(n)}$("crumb").innerHTML=a.map((x,i)=>i==a.length-1?esc(x.name):`<a data-n="${i}">${esc(x.name)}</a>`).join(" › ");$("crumb").querySelectorAll("a").forEach(el=>el.onclick=()=>{go(a[+el.dataset.n])})}
const reg=[];
function folderHtml(n,showPath){const id=reg.push({t:"d",n})-1;return `<div class="item"><div class="row"><div class="ic">📁</div><div class="nm link" data-go="${id}">${esc(n.name)}${showPath?`<div class="path">${esc(pathOf(parent.get(n)))}</div>`:""}<div class="meta">${n.A.v} 个视频 · ${n.folders.length?n.folders.length+" 个子文件夹 · ":""}${fmt(n.A.s)}</div></div></div><div class="btns"><a class="btn p" href="${SHARE}" target="_blank" rel="noopener">在 115 打开</a></div></div>`}
function fileHtml(f,p){const id=reg.push({t:"f",f})-1;const e=ext(f.name)||"—";return `<div class="item"><div class="row"><div class="ic">${isVid(f)?"🎬":"📄"}</div><div class="nm">${esc(f.name)}<div class="meta">${fmt(f.size)}<span class="tag">${e.toUpperCase()}</span>${isVid(f)?"":'<span class="tag">非视频</span>'}</div>${p?`<div class="path">${esc(pathOf(p))}</div>`:""}</div></div><div class="btns"><button class="btn" data-copy="${id}">复制文件名</button><a class="btn p" href="${SHARE}" target="_blank" rel="noopener">在 115 打开</a></div></div>`}
function render(){reg.length=0;const q=$("q").value.trim().toLowerCase();let h="";
if(!q){crumb();cur.folders.forEach(c=>h+=folderHtml(c));cur.files.forEach(f=>h+=fileHtml(f));if(!h)h='<div class="empty">这个文件夹是空的</div>'}
else{$("crumb").textContent="搜索结果";let n=0;const lim=300;(function s(x){for(const c of x.folders){if(c.name.toLowerCase().includes(q)&&n++<lim)h+=folderHtml(c,1);s(c)}for(const f of x.files){if(f.name.toLowerCase().includes(q)&&n++<lim)h+=fileHtml(f,x)}})(TREE);if(!h)h='<div class="empty">没有找到匹配项</div>'}
$("list").innerHTML=h}
function go(n){cur=n;$("q").value="";render();scrollTo(0,0)}
$("list").onclick=e=>{const g=e.target.closest("[data-go]");if(g){go(reg[+g.dataset.go].n);return}
const c=e.target.closest("[data-copy]");if(c){const t=reg[+c.dataset.copy].f.name;copy(t)}};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1400)}
function copy(t){const ok=()=>toast("已复制文件名");if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,()=>fb(t,ok))}else fb(t,ok)}
function fb(t,ok){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){toast("复制失败，请长按文件名手动复制")}a.remove()}
$("q").oninput=render;
$("reload").onclick=function(){var u=new URL(location.href);u.searchParams.set("r",String(Date.now()));location.replace(u.href)};
stats();render();
</script></body></html>
